databases:
  - name: echelon-db
    plan: free
    databaseName: echelon
    user: echelon

services:
  - type: web
    name: echelon-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn echelon.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: echelon-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: echelon-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.vercel.app
      - key: FRONTEND_URL
        value: https://your-frontend-domain.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://your-frontend-domain.vercel.app
      - key: WEB_CONCURRENCY
        value: "4"
